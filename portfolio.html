<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Χαρτοφυλάκιο | TimeToCompound</title>
  <link rel="icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green:   #1B3A2D;
      --gold:    #B8924A;
      --paper:   #F4F1EB;
      --ink:     #1a1a1a;
      --muted:   #7a7a7a;
      --border:  rgba(27,58,45,0.13);
      --gain:    #2e7d52;
      --loss:    #b03030;
      --gain-bg: rgba(46,125,82,0.09);
      --loss-bg: rgba(176,48,48,0.09);
      --card:    #ffffff;
      --shadow:  0 2px 20px rgba(27,58,45,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

    nav { background: var(--green); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 60px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; color: var(--gold); text-decoration: none; }
    .nav-back  { font-size: .85rem; color: rgba(255,255,255,.6); text-decoration: none; transition: color .2s; }
    .nav-back:hover { color: var(--gold); }

    .hero { background: var(--green); padding: 2.8rem 2rem 4rem; text-align: center; position: relative; overflow: hidden; }
    .hero::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 40px; background: var(--paper); clip-path: ellipse(55% 100% at 50% 100%); }
    .hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.8rem,4vw,2.6rem); color: #fff; font-weight: 400; margin-bottom: .35rem; }
    .hero h1 em { color: var(--gold); font-style: italic; }
    .hero p { color: rgba(255,255,255,.5); font-size: .75rem; letter-spacing: .1em; }

    main { max-width: 700px; margin: 0 auto; padding: 1.8rem 1.2rem 4rem; }

    .banner {
      background: var(--green); border-radius: 12px; padding: 1.6rem 1.8rem;
      margin-bottom: 1.4rem; box-shadow: var(--shadow);
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;
    }
    .bn-label { font-size: .65rem; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.45); margin-bottom: .3rem; }
    .bn-val   { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 600; color: #fff; line-height: 1.05; }
    .bn-val.gain { color: #6EE7B7; }
    .bn-val.loss { color: #FCA5A5; }
    .bn-sub      { font-size: .72rem; margin-top: .2rem; }
    .bn-sub.gain { color: rgba(110,231,183,.7); }
    .bn-sub.loss { color: rgba(252,165,165,.7); }

    .sec { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; color: var(--green); margin-bottom: .8rem; display: flex; align-items: center; gap: .5rem; }
    .sec::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .hcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 1.2rem; overflow: hidden; }
    .hcard-top { padding: 1.2rem 1.4rem; display: grid; grid-template-columns: 1fr auto; gap: .4rem; }
    .h-ticker  { font-weight: 700; font-size: 1rem; color: var(--green); letter-spacing: .04em; }
    .h-name    { font-size: .75rem; color: var(--muted); margin-top: 1px; }
    .h-shares  { font-size: .7rem; color: var(--muted); margin-top: 6px; }
    .h-right   { text-align: right; }
    .h-current { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; color: var(--ink); line-height: 1; }
    .h-buy     { font-size: .7rem; color: var(--muted); margin-top: 3px; }

    .hcard-bottom { border-top: 1px solid var(--border); padding: .9rem 1.4rem; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; background: rgba(27,58,45,.02); }
    .stat-label { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 3px; }
    .stat-val   { font-size: .95rem; font-weight: 600; color: var(--ink); }
    .stat-val.gain { color: var(--gain); }
    .stat-val.loss { color: var(--loss); }

    .cash-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 1.2rem; overflow: hidden; }
    .cash-row  { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.4rem; border-bottom: 1px solid var(--border); }
    .cash-row:last-child { border-bottom: none; }
    .cash-left { display: flex; align-items: center; gap: .7rem; }
    .cash-icon { width: 30px; height: 30px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; color: var(--gold); }
    .cash-ccy  { font-weight: 500; font-size: .88rem; }
    .cash-sub  { font-size: .68rem; color: var(--muted); }
    .cash-amt  { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: var(--ink); }
    .cash-note { font-size: .7rem; color: var(--muted); }

    .update-note { display: flex; align-items: center; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-bottom: 1.2rem; padding: .6rem .9rem; background: rgba(184,146,74,.06); border: 1px solid rgba(184,146,74,.2); border-radius: 6px; }
    .update-note span { color: var(--gold); font-weight: 500; }

    .disclaimer { font-size: .73rem; color: var(--muted); line-height: 1.65; padding: 1rem 1.2rem; background: rgba(27,58,45,.03); border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0; margin-top: .4rem; }

    footer { background: var(--green); text-align: center; padding: 1.5rem; font-size: .76rem; color: rgba(255,255,255,.4); margin-top: 2rem; }
    footer a { color: var(--gold); text-decoration: none; }

    @media(max-width:500px) {
      .banner { grid-template-columns: 1fr 1fr; }
      .banner > div:last-child { grid-column: 1/-1; }
      .hcard-bottom { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">TimeToCompound</a>
  <a class="nav-back" href="index.html">← Αρχική</a>
</nav>

<div class="hero">
  <h1>Το <em>Χαρτοφυλάκιό</em> μου</h1>
  <p>ΠΡΑΓΜΑΤΙΚΕΣ ΘΕΣΕΙΣ · ΔΙΑΦΑΝΕΙΑ</p>
</div>

<main id="app">
  <div style="text-align:center;padding:2rem;color:var(--muted);font-style:italic">Φόρτωση…</div>
</main>

<footer>
  © 2026 TimeToCompound.com · <a href="https://twitter.com/TimeToCompound" target="_blank">@TimeToCompound</a>
</footer>

<script>
const fmt2 = n => n.toLocaleString('el-GR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmt0 = n => n.toLocaleString('el-GR', {minimumFractionDigits:0,  maximumFractionDigits:0});
const usd  = n => '$' + fmt2(n);
const eur  = n => '€' + fmt2(n);

async function render() {
  const app = document.getElementById('app');
  let cfg;
  try {
    const r = await fetch('portfolio.json?v=' + Date.now());
    cfg = await r.json();
  } catch(e) {
    app.innerHTML = '<p style="color:var(--loss);text-align:center;padding:2rem">❌ Σφάλμα φόρτωσης portfolio.json</p>';
    return;
  }

  const { holdings, cash } = cfg;

  // ── Υπολογισμοί ────────────────────────────────────────────
  let totalInvested = 0, totalCurrent = 0;

  const hData = holdings.map(h => {
    const sym        = h.currency === 'USD' ? '$' : '€';
    const invested   = h.shares * h.avg_buy_price;
    const currentVal = h.shares * h.current_price;
    const pnlAbs     = currentVal - invested;
    const pnlPct     = (pnlAbs / invested) * 100;
    totalInvested   += invested;
    totalCurrent    += currentVal;
    return { ...h, sym, invested, currentVal, pnlAbs, pnlPct };
  });

  const totalPnlAbs = totalCurrent - totalInvested;
  const totalPnlPct = (totalPnlAbs / totalInvested) * 100;
  const gc = totalPnlPct >= 0 ? 'gain' : 'loss';
  const sym0 = hData[0]?.sym ?? '$';

  // ── Banner ─────────────────────────────────────────────────
  const bannerHTML = `
    <div class="banner">
      <div>
        <div class="bn-label">Επενδεδυμένο</div>
        <div class="bn-val">${sym0}${fmt0(totalInvested)}</div>
      </div>
      <div>
        <div class="bn-label">Τρέχουσα Αξία</div>
        <div class="bn-val">${sym0}${fmt0(totalCurrent)}</div>
      </div>
      <div>
        <div class="bn-label">Κέρδος / Ζημία</div>
        <div class="bn-val ${gc}">${totalPnlAbs>=0?'+':''}${sym0}${fmt0(Math.abs(totalPnlAbs))}</div>
        <div class="bn-sub ${gc}">${totalPnlPct>=0?'▲':'▼'} ${Math.abs(totalPnlPct).toFixed(2)}%</div>
      </div>
    </div>`;

  // ── Update note ─────────────────────────────────────────────
  const noteHTML = `
    <div class="update-note">
      <span>📅 Τιμές από: ${cfg.last_price_update ?? '—'}</span>
      <span>Ενημέρωσε current_price στο portfolio.json</span>
    </div>`;

  // ── Holdings ────────────────────────────────────────────────
  const holdingsHTML = hData.map(h => {
    const c = h.pnlPct >= 0 ? 'gain' : 'loss';
    const arrow = h.pnlPct >= 0 ? '▲' : '▼';
    return `
    <div class="hcard">
      <div class="hcard-top">
        <div>
          <div class="h-ticker">${h.ticker}</div>
          <div class="h-name">${h.name}</div>
          <div class="h-shares">${h.shares} τεμάχια</div>
        </div>
        <div class="h-right">
          <div class="h-current">${h.sym}${fmt2(h.current_price)}</div>
          <div class="h-buy">Αγορά: ${h.sym}${fmt2(h.avg_buy_price)}</div>
        </div>
      </div>
      <div class="hcard-bottom">
        <div>
          <div class="stat-label">Κόστος</div>
          <div class="stat-val">${h.sym}${fmt0(h.invested)}</div>
        </div>
        <div>
          <div class="stat-label">Αξία σήμερα</div>
          <div class="stat-val">${h.sym}${fmt0(h.currentVal)}</div>
        </div>
        <div>
          <div class="stat-label">P&amp;L</div>
          <div class="stat-val ${c}">${arrow} ${Math.abs(h.pnlPct).toFixed(2)}%<br>${h.pnlAbs>=0?'+':'−'}${h.sym}${fmt0(Math.abs(h.pnlAbs))}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  // ── Cash ────────────────────────────────────────────────────
  const cashHTML = `
    <div class="cash-card">
      <div class="cash-row">
        <div class="cash-left">
          <div class="cash-icon">€</div>
          <div><div class="cash-ccy">Euro</div><div class="cash-sub">EUR</div></div>
        </div>
        <div class="cash-amt">${eur(cash.eur)}</div>
      </div>
      <div class="cash-row">
        <div class="cash-left">
          <div class="cash-icon">$</div>
          <div><div class="cash-ccy">US Dollar</div><div class="cash-sub">USD</div></div>
        </div>
        <div>
          <div class="cash-amt">${usd(cash.usd)}</div>
          <div class="cash-note">≈ ${eur(cash.usd / cash.usd_rate)}</div>
        </div>
      </div>
    </div>`;

  app.innerHTML = `
    ${bannerHTML}
    ${noteHTML}
    <div class="sec">Μετοχές & ETF</div>
    ${holdingsHTML}
    <div class="sec">Μετρητά</div>
    ${cashHTML}
    <div class="disclaimer">
      ⚠️ Αυτό το χαρτοφυλάκιο αποτυπώνει πραγματικές μου θέσεις και δεν αποτελεί επενδυτική σύσταση.
      Κάθε επενδυτής φέρει την αποκλειστική ευθύνη των αποφάσεών του.
    </div>`;
}

render();
</script>
</body>
</html>
